<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DernDee - Level 1: The Safety Path</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: #0a0a0f;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ===== 3D SCENE CONTAINER ===== */
        .game-scene {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            perspective: 1000px;
            background: linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            overflow: hidden;
        }

        /* ===== THE PATH (เส้นทางเดิน) ===== */
        .path-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) rotateX(60deg);
            transform-origin: center bottom;
            width: 300px;
            height: 600px;
        }

        .the-path {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                    rgba(59, 130, 246, 0.05) 0%,
                    rgba(59, 130, 246, 0.15) 100%);
            border-left: 3px solid rgba(59, 130, 246, 0.4);
            border-right: 3px solid rgba(59, 130, 246, 0.4);
            position: relative;
            box-shadow: inset 0 0 50px rgba(59, 130, 246, 0.1);
        }

        .path-edge {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg,
                    rgba(59, 130, 246, 0.2),
                    rgba(59, 130, 246, 0.8));
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transition: all 0.3s;
        }

        .path-edge.left {
            left: -2px;
        }

        .path-edge.right {
            right: -2px;
        }

        .path-edge.warning {
            background: linear-gradient(180deg, rgba(251, 191, 36, 0.5), rgba(251, 191, 36, 1));
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
            animation: edgePulse 0.5s infinite;
        }

        @keyframes edgePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Grid lines on path */
        .path-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 30px 40px;
            animation: gridMove 2s linear infinite;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 80px;
            }
        }

        /* ===== LASER HURDLE (เส้นเลเซอร์) ===== */
        .laser-hurdle {
            position: absolute;
            left: 5%;
            right: 5%;
            height: 8px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(239, 68, 68, 0.8) 20%,
                    rgba(239, 68, 68, 1) 50%,
                    rgba(239, 68, 68, 0.8) 80%,
                    transparent);
            border-radius: 4px;
            box-shadow:
                0 0 20px rgba(239, 68, 68, 0.8),
                0 0 40px rgba(239, 68, 68, 0.4),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: laserPulse 1s ease-in-out infinite;
            transition: all 0.3s;
        }

        .laser-hurdle.safe {
            background: linear-gradient(90deg,
                    transparent,
                    rgba(34, 197, 94, 0.8) 20%,
                    rgba(34, 197, 94, 1) 50%,
                    rgba(34, 197, 94, 0.8) 80%,
                    transparent);
            box-shadow:
                0 0 30px rgba(34, 197, 94, 1),
                0 0 60px rgba(34, 197, 94, 0.6);
        }

        .laser-hurdle.explode {
            animation: laserExplode 0.5s forwards;
        }

        @keyframes laserPulse {

            0%,
            100% {
                opacity: 0.9;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes laserExplode {
            0% {
                transform: scaleY(1);
                opacity: 1;
            }

            50% {
                transform: scaleY(3);
                opacity: 0.8;
            }

            100% {
                transform: scaleY(0);
                opacity: 0;
            }
        }

        .laser-label {
            position: absolute;
            right: -80px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: rgba(239, 68, 68, 0.9);
            white-space: nowrap;
        }

        /* ===== PLAYER FOOT (รองเท้าผู้เล่น) ===== */
        .player-foot {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 120px;
            transition: bottom 0.1s ease-out;
            z-index: 100;
        }

        .shoe {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            border-radius: 40px 40px 20px 20px;
            position: relative;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(59, 130, 246, 0.3);
        }

        .shoe::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 15px;
            background: #1e293b;
            border-radius: 0 0 10px 10px;
        }

        .shoe-glow {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: radial-gradient(ellipse, rgba(59, 130, 246, 0.5), transparent);
            border-radius: 50%;
            transition: opacity 0.2s;
        }

        .foot-shadow {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 30px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.4), transparent);
            border-radius: 50%;
            transition: all 0.1s;
        }

        /* ===== HUD (Heads Up Display) ===== */
        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 200;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .score-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #FCD34D;
            text-shadow: 0 0 20px rgba(252, 211, 77, 0.5);
        }

        .combo-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .combo-ring {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid rgba(59, 130, 246, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #3B82F6;
            transition: all 0.3s;
        }

        .combo-ring.active {
            border-color: #22C55E;
            color: #22C55E;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .combo-ring.high {
            border-color: #FCD34D;
            color: #FCD34D;
            animation: comboPulse 0.5s infinite;
        }

        @keyframes comboPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .hud-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .progress-container {
            width: 60%;
            max-width: 400px;
            height: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B82F6, #22C55E);
            border-radius: 10px;
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .progress-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .vital-display {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 10px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }

        .vital-value {
            color: #22C55E;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .vital-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.6rem;
        }

        /* ===== AVATAR COACH ===== */
        .coach-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            z-index: 150;
        }

        .coach-frame {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .coach-video {
            width: 100%;
            display: block;
        }

        .coach-bubble {
            background: white;
            color: #1e293b;
            padding: 10px 14px;
            border-radius: 15px;
            border-bottom-right-radius: 4px;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        /* ===== POPUP MESSAGES ===== */
        .popup-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
        }

        .popup-message.perfect {
            color: #22C55E;
            text-shadow:
                0 0 20px rgba(34, 197, 94, 0.8),
                0 0 40px rgba(34, 197, 94, 0.5);
        }

        .popup-message.warning {
            color: #EF4444;
            text-shadow:
                0 0 20px rgba(239, 68, 68, 0.8),
                0 0 40px rgba(239, 68, 68, 0.5);
        }

        .popup-message.show {
            animation: popupShow 0.8s ease-out forwards;
        }

        @keyframes popupShow {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-50px);
            }
        }

        /* ===== SCORE POPUP ===== */
        .score-popup {
            position: fixed;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #FCD34D;
            text-shadow: 0 0 10px rgba(252, 211, 77, 0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 250;
        }

        .score-popup.show {
            animation: scoreFloat 1s ease-out forwards;
        }

        @keyframes scoreFloat {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-80px);
            }
        }

        /* ===== VIGNETTE EFFECTS ===== */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .vignette.danger {
            background: radial-gradient(ellipse at center,
                    transparent 50%,
                    rgba(239, 68, 68, 0.4) 100%);
            opacity: 1;
        }

        .vignette.success {
            background: radial-gradient(ellipse at center,
                    transparent 50%,
                    rgba(34, 197, 94, 0.3) 100%);
            opacity: 1;
        }

        /* ===== PARTICLES ===== */
        .particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 250;
        }

        .particle.success {
            background: #22C55E;
            box-shadow: 0 0 10px #22C55E;
        }

        .particle.fail {
            background: #EF4444;
            box-shadow: 0 0 10px #EF4444;
        }

        /* ===== COUNTDOWN OVERLAY ===== */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .countdown-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 15rem;
            font-weight: 900;
            color: #3B82F6;
            text-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
            animation: countPop 1s ease-out;
        }

        @keyframes countPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .countdown-text {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* ===== LEVEL BADGE ===== */
        .level-badge {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(59, 130, 246, 0.5);
            padding: 8px 24px;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: white;
            z-index: 200;
        }
    </style>
</head>

<body>
    <!-- Vignette Effects -->
    <div class="vignette" id="vignette"></div>

    <!-- Countdown Overlay -->
    <div class="countdown-overlay" id="countdown">
        <div class="countdown-number" id="countNumber">3</div>
        <div class="countdown-text">เตรียมตัวให้พร้อม...</div>
    </div>

    <!-- Popup Messages -->
    <div class="popup-message perfect" id="popupPerfect">PERFECT!</div>
    <div class="popup-message warning" id="popupWarning">WATCH OUT!</div>

    <!-- Level Badge -->
    <div class="level-badge">🛡️ LEVEL 1: THE SAFETY PATH</div>

    <!-- 3D Game Scene -->
    <div class="game-scene">
        <!-- The Path -->
        <div class="path-container">
            <div class="the-path">
                <div class="path-edge left" id="edgeLeft"></div>
                <div class="path-edge right" id="edgeRight"></div>
                <div class="path-grid"></div>

                <!-- Laser Hurdles -->
                <div class="laser-hurdle" id="laser1" style="bottom: 200px;">
                    <span class="laser-label">TARGET > 3cm</span>
                </div>
                <div class="laser-hurdle" id="laser2" style="bottom: 350px;"></div>
                <div class="laser-hurdle" id="laser3" style="bottom: 500px;"></div>
            </div>
        </div>

        <!-- Foot Shadow -->
        <div class="foot-shadow" id="footShadow"></div>

        <!-- Player Foot -->
        <div class="player-foot" id="playerFoot">
            <div class="shoe"></div>
            <div class="shoe-glow"></div>
        </div>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-left">
            <div class="score-display" id="scoreDisplay">0</div>
            <div class="combo-display">
                <div class="combo-ring" id="comboRing">x0</div>
                <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">COMBO</span>
            </div>
        </div>

        <div class="hud-center">
            <div class="progress-container">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <div class="progress-label"><span id="stepsCount">0</span> / 20 Steps</div>
        </div>

        <div class="hud-right">
            <div class="vital-display">
                <div class="vital-value" id="clearanceValue">0.0</div>
                <div class="vital-label">CLEARANCE (cm)</div>
            </div>
            <div class="vital-display">
                <div class="vital-value" id="cadenceValue">0</div>
                <div class="vital-label">CADENCE (spm)</div>
            </div>
        </div>
    </div>

    <!-- Coach Avatar -->
    <div class="coach-container">
        <div class="coach-frame">
            <video id="coachVideo" class="coach-video" autoplay loop muted playsinline>
                <source src="videos/1.mp4" type="video/mp4">
            </video>
        </div>
        <div class="coach-bubble" id="coachBubble">ยกเท้าสวยมากครับ! 👍</div>
    </div>

    <script>
        // ===== GAME STATE =====
        let isPlaying = false;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let successSteps = 0;
        const targetSteps = 20;
        const targetClearance = 0.03; // 3cm

        let currentClearance = 0;
        let currentCadence = 0;
        let footHeight = 0;
        let isSwinging = false;

        // ===== INIT =====
        function init() {
            startCountdown();
            connectWebSocket();
        }

        // ===== COUNTDOWN =====
        function startCountdown() {
            const overlay = document.getElementById('countdown');
            const numEl = document.getElementById('countNumber');
            let count = 3;

            playCoach('10.mp4', 'พร้อมนะครับ... เริ่มได้เลย!');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    numEl.textContent = count;
                    numEl.style.animation = 'none';
                    void numEl.offsetWidth;
                    numEl.style.animation = 'countPop 1s ease-out';
                } else if (count === 0) {
                    numEl.textContent = 'GO!';
                    numEl.style.color = '#22C55E';
                } else {
                    clearInterval(interval);
                    overlay.classList.add('hidden');
                    startGame();
                }
            }, 1000);
        }

        function startGame() {
            isPlaying = true;
            playCoach('1.mp4');
        }

        // ===== WEBSOCKET =====
        function connectWebSocket() {
            const ws = new WebSocket('ws://localhost:8765');

            ws.onmessage = (event) => {
                if (!isPlaying) return;
                const msg = JSON.parse(event.data);
                if (msg.type === 'DATA') {
                    processData(msg.payload);
                }
            };

            ws.onerror = () => console.error('WS Error');
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        function processData(payload) {
            // 1. Only update gait metrics when they exist (not every frame)
            if (payload.gait_metrics) {
                // 2. Fixed: clearance_m (not foot_clearance_m)
                const clearance = payload.gait_metrics.spatial?.clearance_m || 0;
                const cadence = payload.gait_metrics.temporal?.cadence_spm || 0;

                // Update global state
                currentClearance = clearance;
                currentCadence = cadence;

                // Update HUD only when we have fresh data
                document.getElementById('clearanceValue').textContent = (clearance * 100).toFixed(1);
                document.getElementById('cadenceValue').textContent = Math.round(cadence);

                // Update foot visual position
                updateFootPosition(clearance);
            }

            // Check trunk sway (available every frame)
            const trunkAngle = payload.trunk_sway || 0;
            updateEdgeWarnings(trunkAngle);

            // Handle gait events
            if (payload.gait_event === 'TOE_OFF') {
                isSwinging = true;
            }

            if (payload.gait_event === 'HEEL_STRIKE' || payload.gait_event === 'STATIC_LANDING') {
                if (isSwinging) {
                    evaluateStep(currentClearance);
                    isSwinging = false;
                }
            }
        }

        function updateFootPosition(clearance) {
            const foot = document.getElementById('playerFoot');
            const shadow = document.getElementById('footShadow');

            // Map clearance to visual height (0-0.15m -> 100-280px)
            const heightOffset = Math.min(clearance * 1200, 180);
            foot.style.bottom = `${100 + heightOffset}px`;

            // Shadow gets smaller as foot goes higher
            const shadowScale = Math.max(0.3, 1 - (heightOffset / 200));
            shadow.style.transform = `translateX(-50%) scale(${shadowScale})`;
            shadow.style.opacity = shadowScale;
        }

        function updateEdgeWarnings(trunkAngle) {
            const leftEdge = document.getElementById('edgeLeft');
            const rightEdge = document.getElementById('edgeRight');

            leftEdge.classList.remove('warning');
            rightEdge.classList.remove('warning');

            if (trunkAngle < -15) {
                leftEdge.classList.add('warning');
            } else if (trunkAngle > 15) {
                rightEdge.classList.add('warning');
            }
        }

        // ===== STEP EVALUATION =====
        function evaluateStep(peakClearance) {
            if (peakClearance >= targetClearance) {
                handleSuccess(peakClearance);
            } else {
                handleFail();
            }
        }

        function handleSuccess(clearance) {
            successSteps++;
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            // Score calculation
            const bonus = combo >= 5 ? 50 : (combo >= 3 ? 25 : 0);
            const stepScore = 100 + bonus;
            score += stepScore;

            // Update UI
            updateHUD();

            // Visual effects
            showPopup('perfect');
            showVignette('success');
            showScorePopup(stepScore);
            animateLaser('safe');
            spawnParticles('success');

            // Combo ring effect
            const ring = document.getElementById('comboRing');
            ring.classList.remove('active', 'high');
            ring.classList.add(combo >= 5 ? 'high' : 'active');

            // Coach feedback
            if (combo >= 5) {
                playCoach('9.mp4', 'COMBO x' + combo + '! สุดยอดครับ! 🔥');
            } else if (successSteps === 1) {
                playCoach('9.mp4', 'ยกเท้าสวยมากครับ! 👍');
            }

            // Check win
            if (successSteps >= targetSteps) {
                setTimeout(showWinScreen, 500);
            }
        }

        function handleFail() {
            combo = 0;

            // Update UI
            updateHUD();

            // Visual effects
            showPopup('warning');
            showVignette('danger');
            animateLaser('fail');
            spawnParticles('fail');

            // Reset combo ring
            const ring = document.getElementById('comboRing');
            ring.classList.remove('active', 'high');

            // Coach warning
            playCoach('2.mp4', 'ระวังสะดุด! ยกสูงอีกนิดครับ');
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').textContent = score.toLocaleString();
            document.getElementById('comboRing').textContent = 'x' + combo;
            document.getElementById('stepsCount').textContent = successSteps;
            document.getElementById('progressFill').style.width =
                `${(successSteps / targetSteps) * 100}%`;
        }

        // ===== VISUAL EFFECTS =====
        function showPopup(type) {
            const popup = document.getElementById(type === 'perfect' ? 'popupPerfect' : 'popupWarning');
            popup.classList.remove('show');
            void popup.offsetWidth;
            popup.classList.add('show');
        }

        function showVignette(type) {
            const v = document.getElementById('vignette');
            v.classList.remove('danger', 'success');
            v.classList.add(type);
            setTimeout(() => v.classList.remove(type), 300);
        }

        function showScorePopup(points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup show';
            popup.textContent = '+' + points;
            popup.style.left = '50%';
            popup.style.top = '40%';
            popup.style.transform = 'translateX(-50%)';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);
        }

        function animateLaser(state) {
            const laser = document.getElementById('laser1');
            laser.classList.remove('safe', 'explode');

            if (state === 'safe') {
                laser.classList.add('safe');
                setTimeout(() => {
                    laser.classList.add('explode');
                    setTimeout(() => {
                        laser.classList.remove('safe', 'explode');
                    }, 500);
                }, 200);
            }
        }

        function spawnParticles(type) {
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = `particle ${type}`;
                p.style.left = `${50 + (Math.random() - 0.5) * 20}%`;
                p.style.top = '60%';

                const angle = (Math.PI * 2 / 12) * i;
                const distance = 100 + Math.random() * 80;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 50;

                p.style.transition = 'all 0.8s ease-out';
                document.body.appendChild(p);

                requestAnimationFrame(() => {
                    p.style.transform = `translate(${dx}px, ${dy}px)`;
                    p.style.opacity = '0';
                });

                setTimeout(() => p.remove(), 800);
            }
        }

        // ===== COACH =====
        function playCoach(video, message = '') {
            const v = document.getElementById('coachVideo');
            const b = document.getElementById('coachBubble');

            v.src = 'videos/' + video;
            v.loop = (video === '1.mp4');
            v.play().catch(() => { });

            if (message) {
                b.textContent = message;
                b.style.display = 'block';
                setTimeout(() => b.style.display = 'none', 3000);
            } else {
                b.style.display = 'none';
            }
        }

        // ===== WIN SCREEN =====
        function showWinScreen() {
            isPlaying = false;
            playCoach('9.mp4', '🎉 ยินดีด้วยครับ! ผ่านด่านแล้ว!');

            // Show confetti
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'particle success';
                    c.style.left = Math.random() * 100 + '%';
                    c.style.top = '-10px';
                    c.style.transition = 'all 3s linear';
                    document.body.appendChild(c);

                    requestAnimationFrame(() => {
                        c.style.top = '110%';
                        c.style.transform = `rotate(${Math.random() * 720}deg)`;
                    });

                    setTimeout(() => c.remove(), 3000);
                }, i * 30);
            }

            // Redirect after celebration
            setTimeout(() => {
                if (confirm('🎉 ยินดีด้วย! คะแนน: ' + score + '\n\nกลับไปเมนูหลัก?')) {
                    location.href = 'rehab.html';
                }
            }, 3000);
        }

        // ===== START =====
        init();
    </script>
</body>

</html>
