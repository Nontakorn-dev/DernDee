<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DernDee - Game Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
        }

        .level-badge {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #3B82F6;
        }

        .timer-display.warning {
            color: #F59E0B;
        }

        .timer-display.danger {
            color: #EF4444;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .exit-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: rgba(30, 41, 59, 0.5);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #22C55E;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94A3B8;
        }

        /* Main Game Area */
        .game-container {
            padding: 20px;
            position: relative;
        }

        .chart-wrapper {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .chart-title {
            font-size: 1rem;
            color: #94A3B8;
            margin-bottom: 10px;
        }

        /* Target Zone Overlay */
        .target-zone {
            position: absolute;
            left: 60px;
            right: 20px;
            pointer-events: none;
        }

        .danger-zone {
            background: rgba(239, 68, 68, 0.15);
            border-top: 2px dashed #EF4444;
        }

        .target-bar {
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.3));
            border: 2px solid #FCD34D;
            animation: glow 2s infinite;
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
            }

            50% {
                box-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
            }
        }

        .target-label {
            position: absolute;
            right: 10px;
            font-size: 0.7rem;
            color: #22C55E;
            background: rgba(34, 197, 94, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Combo Display */
        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 700;
            color: #FCD34D;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .combo-display.show {
            opacity: 1;
            animation: comboPopup 0.5s ease-out;
        }

        @keyframes comboPopup {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* Success/Fail Flash */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .flash-overlay.success {
            background: rgba(34, 197, 94, 0.3);
            opacity: 1;
        }

        .flash-overlay.fail {
            background: rgba(239, 68, 68, 0.3);
            opacity: 1;
        }

        /* Avatar Section */
        .avatar-section {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 200px;
            z-index: 80;
        }

        .avatar-video {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .avatar-speech {
            background: white;
            color: #1e293b;
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        /* Countdown Overlay */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .countdown-number {
            font-size: 12rem;
            font-weight: 700;
            color: #3B82F6;
            text-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
            animation: countdownPulse 1s ease-in-out;
        }

        .countdown-text {
            font-size: 1.5rem;
            color: #94A3B8;
            margin-top: 20px;
        }

        @keyframes countdownPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Result Modal */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .result-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            color: #1e293b;
        }

        .result-grade {
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FCD34D, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .result-stats {
            background: #F1F5F9;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .result-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #E2E8F0;
        }

        .result-stat-row:last-child {
            border: none;
        }

        .result-btn {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 8px;
        }

        .result-btn.secondary {
            background: #E2E8F0;
            color: #64748B;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall 3s linear forwards;
            z-index: 250;
        }

        @keyframes confettiFall {
            to {
                top: 100vh;
                transform: rotate(720deg);
            }
        }

        /* Progress Ring */
        .progress-ring {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 6;
        }

        .progress-ring .bg {
            stroke: #334155;
        }

        .progress-ring .progress {
            stroke: #22C55E;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.3s;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Flash Overlay -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Countdown Overlay -->
    <div class="countdown-overlay hidden" id="countdownOverlay">
        <div class="countdown-number" id="countdownNumber">3</div>
        <div class="countdown-text">เตรียมตัวให้พร้อม...</div>
    </div>

    <!-- Result Modal -->
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="result-grade" id="resultGrade">A</div>
            <div class="result-title" id="resultTitle">ยอดเยี่ยมมาก!</div>
            <div class="result-stats">
                <div class="result-stat-row">
                    <span>ระยะทาง</span>
                    <span id="resultDistance">0 m</span>
                </div>
                <div class="result-stat-row">
                    <span>จำนวนก้าว</span>
                    <span id="resultSteps">0 ก้าว</span>
                </div>
                <div class="result-stat-row">
                    <span>ความเร็วเฉลี่ย</span>
                    <span id="resultSpeed">0 m/s</span>
                </div>
                <div class="result-stat-row">
                    <span>Combo สูงสุด</span>
                    <span id="resultCombo">x0</span>
                </div>
            </div>
            <button class="result-btn" onclick="location.href='rehab.html'">กลับเมนู</button>
            <button class="result-btn secondary" onclick="restartGame()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <!-- Combo Display -->
    <div class="combo-display" id="comboDisplay">x5</div>

    <!-- Header -->
    <div class="game-header">
        <div class="level-badge" id="levelBadge">🛡️ Level 1: Survivor</div>
        <div class="timer-display" id="timerDisplay">05:00</div>
        <button class="exit-btn" onclick="exitGame()">✕ ออก</button>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="stepsCount">0</div>
            <div class="stat-label">ก้าว</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="distanceCount">0</div>
            <div class="stat-label">เมตร</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="comboCount">x0</div>
            <div class="stat-label">Combo</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="successCount">0/20</div>
            <div class="stat-label">สำเร็จ</div>
        </div>
    </div>

    <!-- Game Container -->
    <div class="game-container">
        <div class="chart-wrapper">
            <div class="chart-title" id="chartTitle">📊 Foot Clearance (ระยะยกเท้า)</div>

            <!-- Target Zone for Level 1 -->
            <div class="target-zone danger-zone" id="dangerZone" style="bottom: 20px; height: 40px;">
                <span class="target-label" style="top: -20px; color: #EF4444; background: rgba(239,68,68,0.2);">⚠️
                    Danger Zone</span>
            </div>

            <!-- Target Bar for Level 3 -->
            <div class="target-zone target-bar hidden" id="targetBar" style="bottom: 120px; height: 50px;">
                <span class="target-label" style="top: 50%; transform: translateY(-50%);">🎯 Target: 40-60°</span>
            </div>

            <canvas id="gameChart" height="250"></canvas>
        </div>
    </div>

    <!-- Avatar Section -->
    <div class="avatar-section">
        <video id="avatarVideo" class="avatar-video" autoplay loop muted playsinline>
            <source src="videos/1.mp4" type="video/mp4">
        </video>
        <div class="avatar-speech" id="avatarSpeech">สู้ๆ ครับ!</div>
    </div>

    <!-- Progress Ring -->
    <div class="progress-ring" id="progressRing">
        <svg width="80" height="80">
            <circle class="bg" cx="40" cy="40" r="35"></circle>
            <circle class="progress" id="progressCircle" cx="40" cy="40" r="35" stroke-dasharray="220"
                stroke-dashoffset="220"></circle>
        </svg>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <script>
        // ===== GAME CONFIG =====
        const levelConfigs = {
            1: {
                name: "Survivor",
                icon: "🛡️",
                parameter: "clearance",
                chartTitle: "📊 Foot Clearance (ระยะยกเท้า)",
                targetType: "min_threshold",
                targetValue: 0.03,
                yMin: 0,
                yMax: 0.15,
                successGoal: 20,
                dangerZone: true,
                targetBar: false
            },
            2: {
                name: "Power Walker",
                icon: "⚡",
                parameter: "speed",
                chartTitle: "📊 Walking Speed (ความเร็ว)",
                targetType: "min_threshold",
                targetValue: 0.4,
                yMin: 0,
                yMax: 1.5,
                successGoal: 15,
                dangerZone: true,
                targetBar: false
            },
            3: {
                name: "Pro Walker",
                icon: "👑",
                parameter: "knee_angle",
                chartTitle: "📊 Knee Flexion (มุมเข่า)",
                targetType: "hit_target",
                targetMin: 40,
                targetMax: 65,
                yMin: 0,
                yMax: 90,
                successGoal: 20,
                dangerZone: false,
                targetBar: true
            }
        };

        // ===== GAME STATE =====
        let gameMode = 'rehab'; // 'rehab' or 'challenge'
        let currentLevel = 1;
        let isPlaying = false;
        let gameStartTime = 0;
        let gameDuration = 300; // 5 minutes default
        let timerInterval = null;

        let steps = 0;
        let distance = 0;
        let combo = 0;
        let maxCombo = 0;
        let successCount = 0;
        let successGoal = 20;

        let chartData = [];
        let gameChart = null;

        // ===== INIT =====
        function init() {
            // Parse URL params
            const params = new URLSearchParams(window.location.search);
            gameMode = params.get('mode') || 'rehab';
            currentLevel = parseInt(params.get('level')) || 1;
            gameDuration = parseInt(params.get('duration')) || 300;

            // Load config from localStorage
            const savedConfig = localStorage.getItem('rehabMode');
            if (savedConfig) {
                const config = JSON.parse(savedConfig);
                if (config.level) currentLevel = config.level;
                if (config.duration) gameDuration = config.duration;
                if (config.challengeMode) gameMode = 'challenge';
            }

            setupUI();
            setupChart();
            connectWebSocket();

            if (gameMode === 'challenge') {
                startCountdown();
            } else {
                startGame();
            }
        }

        function setupUI() {
            const config = levelConfigs[currentLevel] || levelConfigs[1];

            document.getElementById('levelBadge').textContent =
                `${config.icon} Level ${currentLevel}: ${config.name}`;
            document.getElementById('chartTitle').textContent = config.chartTitle;

            successGoal = config.successGoal;
            document.getElementById('successCount').textContent = `0/${successGoal}`;

            // Show/hide zones
            document.getElementById('dangerZone').classList.toggle('hidden', !config.dangerZone);
            document.getElementById('targetBar').classList.toggle('hidden', !config.targetBar);

            // Timer visibility
            if (gameMode !== 'challenge') {
                document.getElementById('timerDisplay').style.display = 'none';
            }
        }

        function setupChart() {
            const config = levelConfigs[currentLevel] || levelConfigs[1];
            const ctx = document.getElementById('gameChart').getContext('2d');

            gameChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(50).fill(''),
                    datasets: [{
                        data: [],
                        borderColor: '#3B82F6',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        y: {
                            min: config.yMin,
                            max: config.yMax,
                            grid: { color: '#334155' },
                            ticks: { color: '#64748B' }
                        },
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // ===== COUNTDOWN =====
        function startCountdown() {
            const overlay = document.getElementById('countdownOverlay');
            const numberEl = document.getElementById('countdownNumber');
            overlay.classList.remove('hidden');

            let count = 3;
            numberEl.textContent = count;
            playAvatarVideo('10.mp4', 'พร้อมนะครับ... เริ่มได้เลย!');

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    numberEl.textContent = count;
                    numberEl.style.animation = 'none';
                    void numberEl.offsetWidth;
                    numberEl.style.animation = 'countdownPulse 1s ease-in-out';
                    playBeep();
                } else if (count === 0) {
                    numberEl.textContent = 'GO!';
                    numberEl.style.color = '#22C55E';
                    playBeep(true);
                } else {
                    clearInterval(countInterval);
                    overlay.classList.add('hidden');
                    startGame();
                }
            }, 1000);
        }

        function playBeep(isGo = false) {
            // Audio feedback (placeholder - add actual audio)
            console.log(isGo ? '🟢 GO!' : '🔵 Beep');
        }

        // ===== GAME LOOP =====
        function startGame() {
            isPlaying = true;
            gameStartTime = Date.now();

            if (gameMode === 'challenge') {
                startTimer();
                scheduleCheerPoints();
            }

            playAvatarVideo('1.mp4');
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
                const remaining = Math.max(0, gameDuration - elapsed);

                updateTimerDisplay(remaining);

                if (remaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds = gameDuration) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const display = document.getElementById('timerDisplay');
            display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            display.classList.remove('warning', 'danger');
            if (seconds <= 60) display.classList.add('danger');
            else if (seconds <= 150) display.classList.add('warning');
        }

        function scheduleCheerPoints() {
            // At 2:30 remaining (150s from start)
            setTimeout(() => {
                if (isPlaying) {
                    playAvatarVideo('9.mp4', 'ครึ่งทางแล้วครับ! สู้ๆ 💪');
                }
            }, (gameDuration - 150) * 1000);

            // At 1:00 remaining
            setTimeout(() => {
                if (isPlaying) {
                    playAvatarVideo('6.mp4', 'อีกนาทีเดียว! เร่งหน่อยครับ 🔥');
                }
            }, (gameDuration - 60) * 1000);
        }

        // ===== WEBSOCKET =====
        function connectWebSocket() {
            const ws = new WebSocket('ws://localhost:8765');

            ws.onmessage = (event) => {
                if (!isPlaying) return;

                const msg = JSON.parse(event.data);
                if (msg.type === 'DATA') {
                    processGameData(msg.payload);
                }
            };

            ws.onerror = () => console.error('WebSocket error');
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        // Store last valid values
        let lastValue = 0;

        function processGameData(payload) {
            const config = levelConfigs[currentLevel] || levelConfigs[1];

            // Only update when gait_metrics exists (not every frame)
            if (payload.gait_metrics) {
                // Extract value based on parameter
                switch (config.parameter) {
                    case 'clearance':
                        lastValue = payload.gait_metrics.spatial?.clearance_m || lastValue;
                        break;
                    case 'speed':
                        lastValue = payload.gait_metrics.temporal?.speed_mps || lastValue;
                        break;
                    case 'knee_angle':
                        lastValue = payload.knee_angle || lastValue;
                        break;
                }

                // Update chart
                chartData.push(lastValue);
                if (chartData.length > 50) chartData.shift();
                gameChart.data.datasets[0].data = chartData;
                gameChart.update('none');
            }

            // Check for step completion (gait event)
            if (payload.gait_event === 'HEEL_STRIKE' || payload.gait_event === 'STATIC_LANDING') {
                handleStepComplete(lastValue, payload);
            }
        }

        function handleStepComplete(peakValue, payload) {
            const config = levelConfigs[currentLevel] || levelConfigs[1];
            steps++;

            // Calculate distance
            const stepLen = payload.gait_metrics?.spatial?.step_length_m || 0;
            distance += stepLen;

            // Update UI
            document.getElementById('stepsCount').textContent = steps;
            document.getElementById('distanceCount').textContent = distance.toFixed(1);

            // Check success/fail
            let isSuccess = false;

            if (config.targetType === 'min_threshold') {
                isSuccess = peakValue >= config.targetValue;
            } else if (config.targetType === 'hit_target') {
                isSuccess = peakValue >= config.targetMin && peakValue <= config.targetMax;
            }

            if (isSuccess) {
                handleSuccess();
            } else {
                handleFail(config.parameter);
            }

            // Update progress
            updateProgress();
        }

        function handleSuccess() {
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            successCount++;

            document.getElementById('comboCount').textContent = `x${combo}`;
            document.getElementById('successCount').textContent = `${successCount}/${successGoal}`;

            // Visual feedback
            flashScreen('success');

            if (combo >= 3) {
                showCombo(combo);
            }

            // Change chart color to green
            gameChart.data.datasets[0].borderColor = '#22C55E';
            gameChart.data.datasets[0].backgroundColor = 'rgba(34, 197, 94, 0.1)';
            gameChart.update('none');

            // Check win condition
            if (successCount >= successGoal) {
                setTimeout(() => endGame(true), 1000);
            }

            // Reset color after delay
            setTimeout(() => {
                gameChart.data.datasets[0].borderColor = '#3B82F6';
                gameChart.data.datasets[0].backgroundColor = 'rgba(59, 130, 246, 0.1)';
                gameChart.update('none');
            }, 500);
        }

        function handleFail(parameter) {
            combo = 0;
            document.getElementById('comboCount').textContent = 'x0';

            flashScreen('fail');

            // Play appropriate avatar video
            const videoMap = {
                'clearance': '2.mp4',
                'trunk': '3.mp4',
                'knee_angle': '4.mp4',
                'speed': '6.mp4'
            };

            playAvatarVideo(videoMap[parameter] || '1.mp4');
        }

        function flashScreen(type) {
            const overlay = document.getElementById('flashOverlay');
            overlay.classList.add(type);
            setTimeout(() => overlay.classList.remove(type), 200);
        }

        function showCombo(count) {
            const el = document.getElementById('comboDisplay');
            el.textContent = `x${count}`;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1000);
        }

        function updateProgress() {
            const progress = Math.min(100, (successCount / successGoal) * 100);
            const circumference = 220;
            const offset = circumference - (progress / 100) * circumference;

            document.getElementById('progressCircle').style.strokeDashoffset = offset;
            document.getElementById('progressText').textContent = `${Math.round(progress)}%`;
        }

        // ===== AVATAR =====
        function playAvatarVideo(filename, speech = '') {
            const video = document.getElementById('avatarVideo');
            const speechEl = document.getElementById('avatarSpeech');

            video.src = `videos/${filename}`;
            video.loop = (filename === '1.mp4');
            video.play().catch(() => { });

            if (speech) {
                speechEl.textContent = speech;
                speechEl.style.display = 'block';
                setTimeout(() => speechEl.style.display = 'none', 3000);
            } else {
                speechEl.style.display = 'none';
            }
        }

        // ===== END GAME =====
        function endGame(isWin = false) {
            isPlaying = false;
            if (timerInterval) clearInterval(timerInterval);

            // Show celebration
            if (isWin || gameMode === 'challenge') {
                showConfetti();
                playAvatarVideo('9.mp4', 'ยอดเยี่ยมมากครับ! 🎉');
            }

            // Calculate grade
            const grade = calculateGrade();

            // Show result
            setTimeout(() => showResult(grade), 1500);
        }

        function calculateGrade() {
            const successRate = successCount / successGoal;
            if (successRate >= 1.0) return 'S';
            if (successRate >= 0.8) return 'A';
            if (successRate >= 0.6) return 'B';
            return 'C';
        }

        function showResult(grade) {
            const titles = {
                'S': '🌟 สมบูรณ์แบบ!',
                'A': '✨ ยอดเยี่ยมมาก!',
                'B': '👍 ดีมาก!',
                'C': '💪 พยายามต่อไป!'
            };

            document.getElementById('resultGrade').textContent = grade;
            document.getElementById('resultTitle').textContent = titles[grade];
            document.getElementById('resultDistance').textContent = `${distance.toFixed(2)} m`;
            document.getElementById('resultSteps').textContent = `${steps} ก้าว`;
            document.getElementById('resultSpeed').textContent =
                steps > 0 ? `${(distance / (steps * 0.5)).toFixed(2)} m/s` : '0 m/s';
            document.getElementById('resultCombo').textContent = `x${maxCombo}`;

            document.getElementById('resultModal').style.display = 'flex';
        }

        function showConfetti() {
            const colors = ['#FCD34D', '#22C55E', '#3B82F6', '#EF4444', '#8B5CF6'];

            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = `${Math.random() * 2}s`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function restartGame() {
            location.reload();
        }

        function exitGame() {
            if (confirm('ต้องการออกจากเกมหรือไม่?')) {
                location.href = 'rehab.html';
            }
        }

        // ===== START =====
        init();
    </script>
</body>

</html>
